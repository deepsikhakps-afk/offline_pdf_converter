<!DOCTYPE html>
<html>
<head>
<title>Flatbed – Offline PDF ↔ JPG Converter</title>
<style>
:root{--bg:#e9eef2;--panel:#fff;--ink:#16202c;--mute:#5b6b7b;--line:#cfd8e0;--accent:#0b6e6e;--accent-ink:#fff;--warn:#b3261e;--glass:#f3f6f8}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--panel:#18222c;--ink:#e6edf3;--mute:#93a3b3;--line:#2b3a48;--accent:#3cc4b8;--accent-ink:#06201d;--warn:#ff8a80;--glass:#1e2a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{max-width:1000px;margin:0 auto;padding:28px 20px 8px}
h1{margin:0;font:700 2rem/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--mute);max-width:60ch}
main{max-width:1000px;margin:0 auto;padding:12px 20px 48px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:4px;margin:16px 0}
.tabs button{border:0;background:none;color:var(--mute);font-family:inherit;font-weight:600;font-size:.95rem;padding:9px 18px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section[hidden]{display:none}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;background:var(--panel);padding:36px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--glass)}
.drop strong{display:block;font-size:1.1rem}
.drop span{color:var(--mute);font-size:.92rem}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
.bar input[type=range]{width:170px}
select{font:inherit;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--glass);color:var(--ink)}
.btn{font-family:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;position:relative}
.card.drag{opacity:.4}
.card canvas,.card img{width:100%;height:170px;object-fit:contain;background:var(--glass);border-radius:6px;display:block}
.cap{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px;font-size:.82rem;color:var(--mute)}
.cap label{display:flex;gap:6px;align-items:center;cursor:pointer}
.mini{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:6px;padding:2px 7px;cursor:pointer;font:inherit}
.mini.del{color:var(--warn)}
.status{min-height:1.5em;margin:10px 0;color:var(--mute)}
.status.err{color:var(--warn)}
progress{width:100%;height:8px;accent-color:var(--accent)}
.empty{color:var(--mute);text-align:center;padding:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Flatbed</h1>
  <p>Convert PDF pages to JPG and JPG images to PDF. Everything runs in your browser, so your files never leave this computer.</p>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab1" aria-selected="true" aria-controls="p1">PDF to JPG</button>
    <button role="tab" id="tab2" aria-selected="false" aria-controls="p2">JPG to PDF</button>
  </div>

  <section id="p1" role="tabpanel" aria-labelledby="tab1">
    <label class="drop" id="drop1" tabindex="0">
      <strong>Choose a PDF or drop it here</strong>
      <span>Pages appear below so you can pick the ones to convert.</span>
      <input type="file" id="pdfIn" accept="application/pdf,.pdf" hidden>
    </label>
    <div class="bar" id="bar1" hidden>
      <label>JPG quality: <output id="qOut">85%</output><input type="range" id="q" min="30" max="100" value="85"></label>
      <label>Resolution
        <select id="scale"><option value="1">Screen (72 dpi)</option><option value="2" selected>Standard (144 dpi)</option><option value="3">High (216 dpi)</option><option value="4.17">Print (300 dpi)</option></select>
      </label>
      <button class="btn" id="selAll">Select all</button>
      <button class="btn" id="selNone">Clear</button>
      <span class="grow"></span>
      <button class="btn" id="dlEach">Download JPGs</button>
      <button class="btn main" id="dlZip">Download as ZIP</button>
    </div>
    <progress id="prog1" max="1" value="0" hidden></progress>
    <div class="status" id="st1" role="status"></div>
    <ul class="grid" id="pages"></ul>
  </section>

  <section id="p2" role="tabpanel" aria-labelledby="tab2" hidden>
    <label class="drop" id="drop2" tabindex="0">
      <strong>Choose JPG images or drop them here</strong>
      <span>Select several at once. Drag the cards, or use the arrows, to set the page order.</span>
      <input type="file" id="imgIn" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple hidden>
    </label>
    <div class="bar" id="bar2" hidden>
      <label>Page size
        <select id="psize"><option value="fit">Match each image</option><option value="a4">A4</option><option value="letter">Letter</option></select>
      </label>
      <label>Margin
        <select id="margin"><option value="0">None</option><option value="10" selected>10 mm</option><option value="20">20 mm</option></select>
      </label>
      <span class="grow"></span>
      <button class="btn" id="clearImgs">Remove all</button>
      <button class="btn main" id="mkPdf">Create PDF</button>
    </div>
    <progress id="prog2" max="1" value="0" hidden></progress>
    <div class="status" id="st2" role="status"></div>
    <ul class="grid" id="imgs"></ul>
  </section>
</main>

<script src="libs/pdf.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>
<script>
"use strict";
pdfjsLib.GlobalWorkerOptions.workerSrc = "libs/pdf.worker.min.js";
const $ = id => document.getElementById(id);
const say = (n, msg, err) => { const s = $("st" + n); s.textContent = msg; s.className = "status" + (err ? " err" : ""); };
const save = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
const nap = () => new Promise(r => setTimeout(r));

/* tabs */
[["tab1","p1"],["tab2","p2"]].forEach(([t, p]) => $(t).onclick = () => {
  ["tab1","tab2"].forEach(x => $(x).setAttribute("aria-selected", x === t));
  ["p1","p2"].forEach(x => $(x).hidden = x !== p);
});

/* drop zones */
function wireDrop(zone, input, handler) {
  zone.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
  ["dragenter","dragover"].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("over"); }));
  zone.addEventListener("drop", e => handler([...e.dataTransfer.files]));
  input.onchange = () => { handler([...input.files]); input.value = ""; };
}

/* ---------- PDF -> JPG ---------- */
let pdf = null, pdfName = "document";
wireDrop($("drop1"), $("pdfIn"), async files => {
  const f = files.find(x => x.type === "application/pdf" || /\.pdf$/i.test(x.name));
  if (!f) return say(1, "That file is not a PDF. Choose a file ending in .pdf.", true);
  try {
    say(1, "Reading " + f.name + "…");
    pdfName = f.name.replace(/\.pdf$/i, "");
    pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    $("pages").innerHTML = "";
    $("bar1").hidden = false;
    for (let i = 1; i <= pdf.numPages; i++) {
      const li = document.createElement("li"); li.className = "card";
      li.innerHTML = '<canvas></canvas><div class="cap"><label><input type="checkbox" checked data-p="' + i + '"> Page ' + i + '</label></div>';
      $("pages").append(li);
      const page = await pdf.getPage(i), vp = page.getViewport({ scale: 0.4 }), c = li.querySelector("canvas");
      c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
    say(1, pdf.numPages + " page" + (pdf.numPages > 1 ? "s" : "") + " loaded. Tick the pages you want.");
  } catch (e) {
    pdf = null; say(1, e.name === "PasswordException" ? "This PDF is password protected. Remove the password and try again." : "Could not open this PDF. The file may be damaged.", true);
  }
});
$("q").oninput = () => $("qOut").textContent = $("q").value + "%";
$("selAll").onclick = () => document.querySelectorAll("#pages input").forEach(c => c.checked = true);
$("selNone").onclick = () => document.querySelectorAll("#pages input").forEach(c => c.checked = false);

async function renderSelected() {
  const nums = [...document.querySelectorAll("#pages input:checked")].map(c => +c.dataset.p);
  if (!nums.length) { say(1, "Select at least one page first.", true); return []; }
  const q = $("q").value / 100, sc = +$("scale").value, out = [], bar = $("prog1");
  bar.hidden = false; bar.max = nums.length; bar.value = 0;
  for (const n of nums) {
    say(1, "Converting page " + n + "…");
    const page = await pdf.getPage(n), vp = page.getViewport({ scale: sc }), c = document.createElement("canvas");
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    out.push({ name: pdfName + "_page" + String(n).padStart(3, "0") + ".jpg", blob });
    bar.value++; c.width = c.height = 0; await nap();
  }
  bar.hidden = true;
  return out;
}
async function run1(fn) {
  if (!pdf) return;
  ["dlEach","dlZip"].forEach(i => $(i).disabled = true);
  try { const files = await renderSelected(); if (files.length) { await fn(files); say(1, "Done. " + files.length + " JPG file" + (files.length > 1 ? "s" : "") + " saved."); } }
  catch (e) { say(1, "Conversion failed. Try a lower resolution for very large pages.", true); }
  ["dlEach","dlZip"].forEach(i => $(i).disabled = false);
}
$("dlEach").onclick = () => run1(async files => { for (const f of files) { save(f.blob, f.name); await new Promise(r => setTimeout(r, 300)); } });
$("dlZip").onclick = () => run1(async files => save(await makeZip(files), pdfName + "_jpg.zip"));

/* minimal ZIP writer (store, no compression: JPGs are already compressed) */
const crcT = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = ~0; for (let i = 0; i < u.length; i++) c = crcT[(c ^ u[i]) & 255] ^ (c >>> 8); return ~c >>> 0; };
async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = enc.encode(f.name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(c.buffer, name);
    offset += 30 + name.length + data.length;
  }
  const csize = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, e.buffer], { type: "application/zip" });
}

/* ---------- JPG -> PDF ---------- */
let imgs = [], uid = 0, dragId = null;
wireDrop($("drop2"), $("imgIn"), files => {
  const ok = files.filter(f => /^image\/(jpeg|png)$/.test(f.type));
  if (!ok.length) return say(2, "No JPG or PNG images found in that selection.", true);
  ok.forEach(f => imgs.push({ id: ++uid, file: f, url: URL.createObjectURL(f) }));
  say(2, imgs.length + " image" + (imgs.length > 1 ? "s" : "") + " ready. Drag to reorder."); drawImgs();
});
function drawImgs() {
  $("bar2").hidden = !imgs.length;
  const ul = $("imgs"); ul.innerHTML = "";
  if (!imgs.length) return;
  imgs.forEach((m, i) => {
    const li = document.createElement("li"); li.className = "card"; li.draggable = true;
    li.innerHTML = '<img alt="Page ' + (i + 1) + '"><div class="cap"><span>Page ' + (i + 1) + '</span><span><button class="mini" data-a="l" aria-label="Move earlier">◀</button> <button class="mini" data-a="r" aria-label="Move later">▶</button> <button class="mini del" data-a="x" aria-label="Remove image">✕</button></span></div>';
    li.querySelector("img").src = m.url;
    li.ondragstart = () => { dragId = m.id; li.classList.add("drag"); };
    li.ondragend = () => li.classList.remove("drag");
    li.ondragover = e => e.preventDefault();
    li.ondrop = e => { e.preventDefault(); const from = imgs.findIndex(x => x.id === dragId); if (from < 0 || from === i) return; imgs.splice(i, 0, imgs.splice(from, 1)[0]); drawImgs(); };
    li.onclick = e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === "x") { URL.revokeObjectURL(m.url); imgs.splice(i, 1); }
      else { const j = a === "l" ? i - 1 : i + 1; if (j < 0 || j >= imgs.length) return; [imgs[i], imgs[j]] = [imgs[j], imgs[i]]; }
      drawImgs();
    };
    ul.append(li);
  });
}
$("clearImgs").onclick = () => { imgs.forEach(m => URL.revokeObjectURL(m.url)); imgs = []; drawImgs(); say(2, ""); };

const loadImg = url => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
const toData = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });

$("mkPdf").onclick = async () => {
  if (!imgs.length) return say(2, "Add at least one image first.", true);
  const btn = $("mkPdf"), bar = $("prog2"), size = $("psize").value, mg = +$("margin").value;
  btn.disabled = true; bar.hidden = false; bar.max = imgs.length; bar.value = 0;
  try {
    const { jsPDF } = window.jspdf; let doc = null;
    for (let i = 0; i < imgs.length; i++) {
      say(2, "Adding image " + (i + 1) + " of " + imgs.length + "…");
      const im = await loadImg(imgs[i].url), data = await toData(imgs[i].file), fmt = imgs[i].file.type === "image/png" ? "PNG" : "JPEG";
      let pw, ph, x = 0, y = 0, w, h;
      if (size === "fit") { pw = im.naturalWidth * 0.2646; ph = im.naturalHeight * 0.2646; w = pw; h = ph; }  /* px to mm at 96 dpi */
      else {
        const [a, b] = size === "a4" ? [210, 297] : [215.9, 279.4], land = im.naturalWidth > im.naturalHeight;
        pw = land ? b : a; ph = land ? a : b;
        const r = Math.min((pw - 2 * mg) / im.naturalWidth, (ph - 2 * mg) / im.naturalHeight);
        w = im.naturalWidth * r; h = im.naturalHeight * r; x = (pw - w) / 2; y = (ph - h) / 2;
      }
      const o = pw > ph ? "l" : "p";
      if (!doc) doc = new jsPDF({ unit: "mm", format: [pw, ph], orientation: o, compress: true }); else doc.addPage([pw, ph], o);
      doc.addImage(data, fmt, x, y, w, h);
      bar.value++; await nap();
    }
    save(doc.output("blob"), "images.pdf");
    say(2, "Done. images.pdf saved with " + imgs.length + " page" + (imgs.length > 1 ? "s" : "") + ".");
  } catch (e) { say(2, "Could not build the PDF. One of the images may be damaged.", true); }
  btn.disabled = false; bar.hidden = true;
};
</script>
</body>
</html>
